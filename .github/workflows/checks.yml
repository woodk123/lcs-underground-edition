name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  development-mcp:
    name: Node tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: upstream/tool/dev_mcp/package-lock.json
      - run: npm ci --prefix upstream/tool/dev_mcp --no-audit --no-fund
      - run: npm test --prefix upstream/tool/dev_mcp

  pipeline:
    uses: ./.github/workflows/ci.yml
