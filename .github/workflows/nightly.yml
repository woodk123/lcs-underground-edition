name: Nightly Windows, Linux and web

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  changes:
    # A manual run on a feature branch must never replace the public nightly.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      fingerprint: ${{ steps.changes.outputs.fingerprint }}
      tag: ${{ steps.changes.outputs.tag }}
      reuse_run: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check for changed build inputs
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/nightly_release.py check
      - name: Reuse successful checks and builds for this exact commit
        id: reuse
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_reuse.py

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && needs.changes.outputs.reuse_run == ''
    uses: ./.github/workflows/ci.yml

  nightly:
    needs: [changes, build]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.changed == 'true' &&
      (needs.changes.outputs.reuse_run != '' || needs.build.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download checked players and all shard evidence
        uses: actions/download-artifact@v8
        with:
          path: .local/artifacts
          run-id: ${{ needs.changes.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Validate original evidence and package all players
        env:
          CI_ARTIFACT_RUN_ID: ${{ needs.changes.outputs.reuse_run || github.run_id }}
          NIGHTLY_FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
          NIGHTLY_TAG: ${{ needs.changes.outputs.tag }}
        run: |
          python scripts/ci_worker.py prepare
          python scripts/package_release.py --root "$PWD" --report "$PWD/.local/reports/ci-release" --nightly --linux "$PWD/.local/linux"
      - name: Publish complete Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
          NIGHTLY_TAG: ${{ needs.changes.outputs.tag }}
        run: python scripts/nightly_release.py publish
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
