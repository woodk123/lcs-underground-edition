name: Checked player artifacts

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: Nightly

env:
  LCS_CHANNEL: ${{ inputs.channel || 'Nightly' }}

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.platform }} checks shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        shard: [0, 1, 2, 3]
        include:
          - platform: linux
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-flutter
        id: flutter
        with:
          target: tests
          save-sdk-cache: ${{ matrix.shard == 0 }}
      - name: Restore incremental test compiler cache
        id: test-cache
        uses: actions/cache/restore@v6
        with:
          path: upstream/build/test_cache
          key: test-kernel-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('scripts/toolchain.json', 'upstream/pubspec.lock', 'upstream/pubspec.yaml', 'scripts/ci_worker.py', 'scripts/ci_shards.py', 'scripts/ci_test_weights.json') }}-${{ hashFiles('upstream/lib/**/*.dart', 'upstream/test/**/*.dart') }}
          restore-keys: test-kernel-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('scripts/toolchain.json', 'upstream/pubspec.lock', 'upstream/pubspec.yaml', 'scripts/ci_worker.py', 'scripts/ci_shards.py', 'scripts/ci_test_weights.json') }}-
      - name: Test and analyze
        env:
          CI_TEST_CACHE_HIT: ${{ steps.test-cache.outputs.cache-hit }}
        run: python scripts/ci_worker.py checks --platform ${{ matrix.platform }} --shard ${{ matrix.shard }}
      - name: Save incremental test compiler cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: upstream/build/test_cache
          key: ${{ steps.test-cache.outputs.cache-primary-key }}
      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ matrix.platform }}-${{ matrix.shard }}
          path: .local/ci/checks-${{ matrix.platform }}-${{ matrix.shard }}/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  builds:
    name: ${{ matrix.target }} release build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-22.04
          - target: windows
            runner: windows-2022
          - target: web
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux native dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: ./.github/actions/setup-flutter
        id: flutter
        with:
          target: ${{ matrix.target }}
          save-sdk-cache: 'true'
          save-cache: ${{ matrix.target != 'web' }}
      - name: Build release players
        run: python scripts/ci_worker.py build --platform ${{ matrix.target }}
      - name: Save compiled generator tooling
        if: matrix.target != 'web' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.flutter.outputs.codegen-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            upstream/.dart_tool/build/entrypoint
            upstream/.dart_tool/pub/bin/build_runner
            upstream/.dart_tool/build_resolvers
          key: ${{ steps.flutter.outputs.codegen-cache-key }}
      - name: Retain build and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: .local/ci/build-${{ matrix.target }}/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify complete CI evidence
    needs: [checks, builds]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: .local/artifacts
      - name: Verify all shards, source identities and runtime hashes
        env:
          CI_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: python scripts/ci_worker.py verify
