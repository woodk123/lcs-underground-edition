name: Linux desktop build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 tests and build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils zip clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: ./.github/actions/setup-flutter
        id: flutter
        with:
          target: linux
          save-sdk-cache: 'true'
          save-cache: 'true'
      - name: Test release tools and verify assets
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/verify_assets.py
      - name: Test, analyze and build Linux
        run: python scripts/build_linux.py
      - name: Save compiled generator tooling
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.flutter.outputs.codegen-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/.dart_tool/build/entrypoint
            upstream/.dart_tool/pub/bin/build_runner
            upstream/.dart_tool/build_resolvers
          key: ${{ steps.flutter.outputs.codegen-cache-key }}
      - name: Retain checked Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: .local/linux/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Retain Linux logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: .local/linux/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
