name: Cached pinned Flutter
description: Restore SDK and package downloads, then verify the exact pinned SDK.
inputs:
  target:
    description: SDK artifacts required by this worker (tests, windows, linux or web).
    required: true
  save-sdk-cache:
    description: One trusted worker per OS and target writes its SDK cache.
    default: 'false'
  save-cache:
    description: Only one trusted build worker per OS writes the shared package cache.
    default: 'false'
outputs:
  codegen-cache-hit:
    description: Whether the generator tooling cache was restored exactly.
    value: ${{ steps.codegen.outputs.cache-hit }}
  codegen-cache-key:
    description: Exact OS, SDK and generator dependency cache key.
    value: ${{ steps.codegen.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Restore pinned SDK
      id: sdk
      uses: actions/cache/restore@v6
      with:
        path: .tools/flutter
        key: flutter-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('scripts/toolchain.json', 'scripts/ci_setup.py') }}
    - name: Restore Dart package downloads
      id: pub
      uses: actions/cache/restore@v6
      with:
        path: .local/pub-cache
        key: pub-v1-${{ runner.os }}-${{ hashFiles('scripts/toolchain.json') }}-${{ hashFiles('upstream/pubspec.lock') }}
        restore-keys: pub-v1-${{ runner.os }}-${{ hashFiles('scripts/toolchain.json') }}-
    - name: Restore compiled generator tooling
      id: codegen
      uses: actions/cache/restore@v6
      with:
        path: |
          upstream/.dart_tool/build/entrypoint
          upstream/.dart_tool/pub/bin/build_runner
          upstream/.dart_tool/build_resolvers
        key: codegen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.json', 'upstream/pubspec.lock', 'upstream/pubspec.yaml', 'upstream/**/build.yaml', 'upstream/build.*.yaml') }}
    - name: Verify SDK and warm dependencies
      shell: bash
      env:
        PUB_CACHE: ${{ github.workspace }}/.local/pub-cache
        FLUTTER_TARGET: ${{ inputs.target }}
      run: python scripts/ci_setup.py --target "$FLUTTER_TARGET"
    - name: Set package cache for subsequent steps
      shell: bash
      env:
        CODEGEN_CACHE_HIT: ${{ steps.codegen.outputs.cache-hit }}
        SDK_CACHE_HIT: ${{ steps.sdk.outputs.cache-hit }}
        FLUTTER_TARGET: ${{ inputs.target }}
      run: |
        echo "PUB_CACHE=${GITHUB_WORKSPACE}/.local/pub-cache" >> "$GITHUB_ENV"
        echo "CI_CODEGEN_CACHE_HIT=${CODEGEN_CACHE_HIT}" >> "$GITHUB_ENV"
        echo "CI_SDK_CACHE_HIT=${SDK_CACHE_HIT}" >> "$GITHUB_ENV"
        echo "CI_SDK_TARGET=${FLUTTER_TARGET}" >> "$GITHUB_ENV"
    - name: Save pinned SDK
      if: inputs.save-sdk-cache == 'true' && github.event_name != 'pull_request' && steps.sdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .tools/flutter
        key: ${{ steps.sdk.outputs.cache-primary-key }}
    - name: Save Dart package downloads
      if: inputs.save-cache == 'true' && github.event_name != 'pull_request' && steps.pub.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .local/pub-cache
        key: ${{ steps.pub.outputs.cache-primary-key }}
