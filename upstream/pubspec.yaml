name: lcs_new_age
description: "Liberal Crime Squad: New Age — The Underground Edition. A satirical game about American politics."
publish_to: 'none'
version: 0.2.6

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pixel_snap: ^0.1.2
  xml: ^6.3.0
  flutter_svg: ^2.0.17
  collection: ^1.17.2
  format: ^1.6.0
  shared_preferences: ^2.2.2
  shared_preferences_platform_interface: ^2.4.2
  json_annotation: ^4.12.0
  file_saver: ^0.2.12
  file_picker: ^9.2.3
  archive: ^3.6.1
  source_map_stack_trace: ^2.1.1
  source_maps: ^0.10.13
  http: ^1.3.0
  cupertino_icons: ^1.0.8
  markdown_widget: ^2.3.2
  idb_shim: ^2.6.6
  sembast: ^3.8.5
  path_provider: ^2.1.5
  path: ^1.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.9.5

flutter:
  assets:
   - assets/xml/
   - assets/flags/
   - assets/maps/
   - assets/art/
   - assets/modern/
   - assets/modern/portraits_v2/
   - assets/changelog.md
   - fonts/journal/OFL.txt
  uses-material-design: true
  fonts:
   - family: JournalSerif
     fonts:
      - asset: fonts/journal/LibreBaskerville-Variable.ttf
      - asset: fonts/journal/LibreBaskerville-Italic-Variable.ttf
        style: italic
   - family: ModernSans
     fonts:
      - asset: fonts/modern/roboto-regular.ttf
      - asset: fonts/modern/roboto-medium.ttf
        weight: 500
      - asset: fonts/modern/roboto-bold.ttf
        weight: 700
      - asset: fonts/modern/roboto-black.ttf
        weight: 900
   # Flutter web otherwise downloads its default family before the first frame.
   # These are the same bundled files used by ModernSans above.
   - family: Roboto
     fonts:
      - asset: fonts/modern/roboto-regular.ttf
      - asset: fonts/modern/roboto-medium.ttf
        weight: 500
      - asset: fonts/modern/roboto-bold.ttf
        weight: 700
      - asset: fonts/modern/roboto-black.ttf
        weight: 900
   - family: SourceCodePro
     fonts:
      - asset: fonts/SourceCodePro-Regular.ttf
