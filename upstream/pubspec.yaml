name: lcs_new_age
description: "Liberal Crime Squad: New Age — The Underground Edition. A satirical game about American politics."
publish_to: 'none'
version: 0.6.10

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pixel_snap: ^0.1.5
  xml: ^7.0.1
  flutter_svg: ^2.3.0
  collection: ^1.19.1
  format: ^4.1.0
  shared_preferences: ^2.5.6
  shared_preferences_platform_interface: ^2.4.2
  json_annotation: ^4.12.0
  file_saver: ^0.7.0
  file_picker: ^13.1.0
  archive: ^4.5.2
  source_map_stack_trace: ^2.1.2
  source_maps: ^0.10.14
  http: ^1.6.0
  cupertino_icons: ^2.0.0
  markdown_widget: ^2.3.2+8
  idb_shim: ^2.10.1+1
  sembast: ^3.9.0
  path_provider: ^2.1.6
  path: ^1.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.1.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  assets:
   - assets/xml/
   - assets/flags/
   - assets/maps/
   - assets/art/
   - assets/modern/
   - assets/modern/portraits_v2/
   - assets/changelog.md
   - fonts/journal/OFL.txt
  uses-material-design: true
  fonts:
   - family: JournalSerif
     fonts:
      - asset: fonts/journal/LibreBaskerville-Variable.ttf
      - asset: fonts/journal/LibreBaskerville-Italic-Variable.ttf
        style: italic
   - family: ModernSans
     fonts:
      - asset: fonts/modern/roboto-regular.ttf
      - asset: fonts/modern/roboto-medium.ttf
        weight: 500
      - asset: fonts/modern/roboto-bold.ttf
        weight: 700
      - asset: fonts/modern/roboto-black.ttf
        weight: 900
   # Flutter web otherwise downloads its default family before the first frame.
   # These are the same bundled files used by ModernSans above.
   - family: Roboto
     fonts:
      - asset: fonts/modern/roboto-regular.ttf
      - asset: fonts/modern/roboto-medium.ttf
        weight: 500
      - asset: fonts/modern/roboto-bold.ttf
        weight: 700
      - asset: fonts/modern/roboto-black.ttf
        weight: 900
   - family: SourceCodePro
     fonts:
      - asset: fonts/SourceCodePro-Regular.ttf
