<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Liberal Crime Squad: New Age — The Underground Edition">
  <meta name="theme-color" content="#4a241e">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LCS:NA Underground">
  <link rel="apple-touch-icon" href="modern_app_icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="modern_app_icon.png" />

  <title>Liberal Crime Squad: New Age — The Underground Edition</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#29251d; }
    /* Flutter's transparent accessibility labels must not enlarge the document.
       Internal Flutter scroll views and the full ARIA strings remain intact. */
    flutter-view { overflow:hidden; }
    #boot { position:fixed; inset:0; display:grid; place-content:center; text-align:center; padding:16px; box-sizing:border-box;
      font:15px/1.6 Georgia,serif; color:#e9e6cd; background:#29251d; }
    #boot strong { font-size:26px; letter-spacing:-.5px; }
    #boot p { color:#d5d0b6; }
    #boot .bar { width:180px; height:3px; background:#625431; margin:12px auto; overflow:hidden; }
    #boot .bar:after { content:''; display:block; width:70px; height:3px; background:#e1d5a7; animation:load 1.5s ease-in-out infinite alternate; }
    @keyframes load { to { transform:translateX(110px); } }
    @media(prefers-reduced-motion:reduce) { #boot .bar:after { animation:none; } }
  </style>
  <div id="boot" role="status"><strong>Liberal Crime Squad: New Age</strong><p>The Underground Edition</p><p>Preparing your next chapter…</p><div class="bar"></div></div>
  <noscript>This game needs JavaScript enabled to run.</noscript>
  <script>window.addEventListener('flutter-first-frame', function(){ document.getElementById('boot')?.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
